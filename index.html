<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>City / Country widget</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }

  #wrap {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    flex-direction: column;
  }

  #cityMask {
    height: 170px;
    overflow: hidden;
    position: relative;
    width: 100%;
  }

  #city {
    font-size: 144px;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: #ffffff;
    text-shadow: 0 6px 36px rgba(0,0,0,0.35);
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    transition: transform 0.8s cubic-bezier(0.6,0,0.2,1), opacity 0.8s ease;
  }

  #city.exit {
    transform: translateY(100%);
    opacity: 0.3;
  }

  #city.enter-start {
    transform: translateY(-100%);
    opacity: 0;
  }

  #city.settled {
    transform: translateY(0);
    opacity: 1;
  }

  #divider {
    width: 96px;
    height: 3px;
    background: rgba(255,255,255,0.55);
    margin: 0 auto;
    flex-shrink: 0;
  }

  #countryMask {
    height: 70px;
    overflow: hidden;
    position: relative;
    width: 100%;
    margin-top: 24px;
  }

  #country {
    font-size: 54px;
    font-weight: 400;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.75);
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    transition: transform 0.8s cubic-bezier(0.6,0,0.2,1), opacity 0.8s ease;
  }

  #country.exit {
    transform: translateY(-100%);
    opacity: 0.3;
  }

  #country.enter-start {
    transform: translateY(100%);
    opacity: 0;
  }

  #country.settled {
    transform: translateY(0);
    opacity: 1;
  }
</style>
</head>
<body>

<div id="wrap">
  <div id="cityMask"><div id="city"></div></div>
  <div id="divider"></div>
  <div id="countryMask"><div id="country"></div></div>
</div>

<script>
/* ======================================================
   НАСТРОЙКА ЧЕРЕЗ ССЫЛКУ (без правки файла).

   Формат ссылки:
   https://.../city-country-widget.html?places=Город:Страна|Город:Страна&interval=4200

   Пример:
   https://.../city-country-widget.html?places=Bangkok:Thailand|Pattaya:Thailand|Phuket:Thailand&interval=5000

   places  — список "Город:Страна", разделённых символом |
   interval — время показа каждой надписи в мс (необязательно, по умолчанию 4200)
   pause   — пауза между исчезновением и появлением следующей надписи, в мс
             (необязательно, по умолчанию 900)

   Пример с длинной паузой:
   ...html?places=Bangkok:Thailand|Phuket:Thailand&interval=5000&pause=2000

   Если параметр places не указан — используется список по умолчанию ниже.
   ВАЖНО: список по умолчанию — один город (Pattaya, Thailand). Даже с одним
   городом анимация продолжает циклично проигрываться (уход/появление).
====================================================== */
const defaultData = [
  { city: "Pattaya", country: "Thailand" }
];
const defaultIntervalMs = 6000;
const defaultPauseMs = 1200;

/* ====================================================== */

function parseParams() {
  const params = new URLSearchParams(window.location.search);
  const placesRaw = params.get("places");
  const intervalRaw = params.get("interval");

  let data = defaultData;
  if (placesRaw) {
    const parsed = placesRaw.split("|").map(pair => {
      const [city, country] = pair.split(":");
      return { city: (city || "").trim(), country: (country || "").trim() };
    }).filter(p => p.city);
    if (parsed.length > 0) data = parsed;
  }

  let intervalMs = defaultIntervalMs;
  const parsedInterval = parseInt(intervalRaw, 10);
  if (!isNaN(parsedInterval) && parsedInterval > 500) {
    intervalMs = parsedInterval;
  }

  const pauseRaw = params.get("pause");
  let pauseMs = defaultPauseMs;
  const parsedPause = parseInt(pauseRaw, 10);
  if (!isNaN(parsedPause) && parsedPause >= 0) {
    pauseMs = parsedPause;
  }

  return { data, intervalMs, pauseMs };
}

const { data, intervalMs, pauseMs } = parseParams();

const cityEl = document.getElementById("city");
const countryEl = document.getElementById("country");
let i = 0;

function render(index) {
  cityEl.textContent = data[index].city;
  countryEl.textContent = data[index].country;
}

function showNext() {
  cityEl.classList.remove("settled");
  cityEl.classList.add("exit");
  countryEl.classList.remove("settled");
  countryEl.classList.add("exit");

  setTimeout(() => {
    i = (i + 1) % data.length;
    render(i);

    cityEl.classList.remove("exit");
    cityEl.classList.add("enter-start");
    countryEl.classList.remove("exit");
    countryEl.classList.add("enter-start");

    void cityEl.offsetWidth;

    cityEl.classList.remove("enter-start");
    cityEl.classList.add("settled");
    countryEl.classList.remove("enter-start");
    countryEl.classList.add("settled");
  }, pauseMs);
}

render(i);
setTimeout(() => {
  cityEl.classList.add("settled");
  countryEl.classList.add("settled");
}, 200);

setInterval(showNext, intervalMs);
</script>

</body>
</html>
